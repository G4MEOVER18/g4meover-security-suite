name: Python Lint
on:
  push:
    branches: [main, master]
    paths: ['**.py', '.github/workflows/python-lint.yml']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  ruff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Ruff installieren
        run: pip install ruff
      - name: Ruff Lint (Annotationen, nicht-blockierend)
        run: ruff check . --output-format=github || true
      - name: Syntax pruefen (py_compile)
        run: python -m compileall -q . || true
